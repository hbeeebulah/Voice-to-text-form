<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VoxForm Voice-to-Text</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid #1e293b;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #6366f1, #4edea3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #0f172a;
      font-size: 15px;
    }
    .title {
      font-weight: 800;
      font-size: 14px;
      color: #ffffff;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .stat-banner {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .stat-num {
      font-size: 18px;
      font-weight: 800;
      color: #4edea3;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 5px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 12px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 8px 10px;
      background: #1e293b;
      border-radius: 9px;
      border: 1px solid #334155;
    }
    .btn {
      width: 100%;
      padding: 9px 14px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .saved-msg {
      text-align: center;
      font-size: 11px;
      color: #4edea3;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">V</div>
      <div>
        <div class="title">VoxForm Extension</div>
        <div class="subtitle">For Google Forms</div>
      </div>
    </div>
  </div>

  <div class="stat-banner">
    <span>Voice Answers Dictated</span>
    <span id="dictationCount" class="stat-num">0</span>
  </div>

  <div class="toggle-row">
    <span>Enable on Google Forms</span>
    <input type="checkbox" id="enabledToggle" checked />
  </div>

  <div class="field">
    <label>VoxForm Server URL</label>
    <input type="text" id="serverUrl" placeholder="https://voice-to-text-form.onrender.com" />
  </div>

  <div class="field">
    <label>Speech Language</label>
    <select id="langSelect">
      <option value="">Auto-Detect Browser Language</option>
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
      <option value="en-NG">English (Nigeria)</option>
      <option value="fr-FR">French</option>
      <option value="es-ES">Spanish</option>
      <option value="de-DE">German</option>
    </select>
  </div>

  <button id="saveBtn" class="btn">Save Settings</button>
  <div id="savedMsg" class="saved-msg">✓ Settings saved!</div>

  <script src="popup.js"></script>
</body>
</html>
