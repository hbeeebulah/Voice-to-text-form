version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - VOICE_AI_API_KEY=${VOICE_AI_API_KEY:-}
      # Uncomment below to connect to PostgreSQL container
      # - DATABASE_URL=postgresql://postgres:postgres@db:5432/voxform
      # Uncomment below to connect to MongoDB container
      # - MONGODB_URI=mongodb://mongo:27017/voxform
    volumes:
      - ./server/data:/app/server/data
    restart: unless-stopped

  # Optional Postgres service
